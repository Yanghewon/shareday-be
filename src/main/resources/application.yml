  server:
    port: 8080

  spring:
    datasource:
      url: jdbc:mysql://localhost:3306/shareday?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      username: root
      password: gPdnjs75312@
      driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: update      # 개발 환경에서만 사용! (create, update, validate 등)
      show-sql: true          # 콘솔에 SQL 출력
      properties:
        hibernate:
          format_sql: true    # SQL 보기 좋게 출력
    threads:
      virtual:
        enabled: true
    security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${GOOGLE_CLIENT_ID}
              client-secret: ${GOOGLE_CLIENT_SECRET}
              scope: profile,email
              redirect-uri: "http://localhost:8080/login/oauth2/code/google"
              client-name: Google
              provider: google

            naver:
              client-id: ${NAVER_CLIENT_ID}
              client-secret: ${NAVER_CLIENT_SECRET}
              client-authentication-method: client_secret_post
              authorization-grant-type: authorization_code
              redirect-uri: "http://localhost:8080/login/oauth2/code/naver"
              scope: name,email
              client-name: Naver
              provider: naver

            kakao:
              client-id: ${KAKAO_CLIENT_ID}
              client-secret: ${KAKAO_CLIENT_SECRET}
              client-authentication-method: client_secret_post
              authorization-grant-type: authorization_code
              redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
              scope: profile_nickname,account_email,profile_image
              client-name: Kakao
              provider: kakao

          provider:
            naver:
              authorization-uri: https://nid.naver.com/oauth2.0/authorize
              token-uri: https://nid.naver.com/oauth2.0/token
              user-info-uri: https://openapi.naver.com/v1/nid/me
              user-name-attribute: response

            kakao:
              authorization-uri: https://kauth.kakao.com/oauth/authorize
              token-uri: https://kauth.kakao.com/oauth/token
              user-info-uri: https://kapi.kakao.com/v2/user/me
              user-name-attribute: id

  app:
    cors:
      allowed-origins: "http://localhost:5173"

  springdoc:
    api-docs:
      enabled: true
      path: /v3/api-docs
    swagger-ui:
      enabled: true
      path: /swagger-ui
      operationsSorter: method
      tagsSorter: alpha